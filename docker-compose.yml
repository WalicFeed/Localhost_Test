services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "change-me-to-a-long-random-string-in-production"
    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data:
